<!-- exploration-form.component.html -->

<div class="page">
  <div class="header">
    <a routerLink="/admissions" class="back">← Retour</a>
    <h2>Demande d’explorations</h2>
  </div>

  <!-- Message d'erreur -->
  <div class="error" *ngIf="err()">
    {{ err() }}
  </div>

  <!-- Infos admission/patient -->
  <div class="card">
    <div class="row">
      <div>
        <div class="label">Admission</div>
        <div class="value">#{{ admissionId }}</div>
      </div>

      <div>
        <div class="label">Patient</div>
        <div class="value">{{ patientNom || '—' }}</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <!-- Explorations demandées -->
      <div class="field span-2">
        <label>Explorations demandées</label>

        <div class="checkbox-list">
          <label class="checkbox-item" *ngFor="let t of types">
            <input
              type="checkbox"
              [checked]="model.explorations.includes(t)"
              (change)="toggleExploration(t, $any($event.target).checked)"
              [disabled]="loading()"
            />
            <span>{{ labelType(t) }}</span>
          </label>
        </div>

        <small class="hint">Tu peux cocher plusieurs examens.</small>
      </div>

      <!-- Urgence -->
      <div class="field">
        <label>Urgence</label>
        <select class="input" [(ngModel)]="model.urgence" name="urgence" [disabled]="loading()">
          <option value="NORMAL">Normal</option>
          <option value="URGENT">Urgent</option>
        </select>
      </div>

      <!-- Note -->
      <div class="field span-2">
        <label>Note / Motif</label>
        <textarea
          class="input textarea"
          rows="6"
          [(ngModel)]="model.note"
          name="note"
          [disabled]="loading()"
          placeholder="Motif de la demande (optionnel)"
        ></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button
        type="button"
        class="btn secondary"
        (click)="generateInvoicePdf()"
        [disabled]="loading() || !model.explorations.length"
        title="Générer la facture PDF avec logo CMC"
      >
        📄 Générer facture PDF
      </button>

      <button
        type="button"
        class="btn primary"
        (click)="save()"
        [disabled]="loading()"
      >
        ✅ Enregistrer la demande
      </button>
    </div>

    <div class="hint" style="margin-top:10px">
      Astuce : coche les examens puis clique sur <b>Générer facture PDF</b>.
    </div>
  </div>
</div>
