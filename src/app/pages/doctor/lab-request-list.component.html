<div class="page">
  <header class="page-header">
    <div>
      <h1>Mes demandes LABO</h1>
      <p class="subtitle">Suivi des examens demandés</p>
    </div>
    <a class="btn btn-primary" routerLink="/doctor/lab/new">+ Nouvelle demande</a>
  </header>

  <div class="card">
    <div class="row" *ngFor="let r of rows()">
      <div>
        <div class="title">Patient #{{ r.patientId }} <span class="muted">• {{ r.tests }}</span></div>
        <div class="meta">Statut: <b>{{ r.status }}</b> — {{ r.createdAt || '' }}</div>
      </div>
      <a class="btn btn-outline" [routerLink]="['/labo/requests', r.id]">Voir</a>
    </div>
    <div class="empty" *ngIf="rows().length===0">Aucune demande.</div>
  </div>
</div>
