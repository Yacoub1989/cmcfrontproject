<div class="page">
  <header class="page-header">
    <div>
      <h1>Nouvelle demande LABO</h1>
      <p class="subtitle">Cardiologie — Demande d’examens biologiques</p>
    </div>
    <a class="btn btn-outline" routerLink="/doctor">← Retour</a>
  </header>

  <div class="card">
    <div class="grid">
      <div class="field">
        <label>Patient ID</label>
        <input class="input" type="number" [(ngModel)]="patientId" [ngModelOptions]="{standalone:true}" />
      </div>

      <div class="field">
        <label>Admission ID (optionnel)</label>
        <input class="input" type="number" [(ngModel)]="admissionId" [ngModelOptions]="{standalone:true}" />
      </div>

      <div class="field span-2">
        <label>Examens demandés</label>
        <textarea class="input" rows="5"
                  [(ngModel)]="tests" [ngModelOptions]="{standalone:true}"
                  placeholder="Ex: NFS, Troponine, CRP, Ionogramme..."></textarea>
      </div>
    </div>

    <div class="alert" *ngIf="err()">{{ err() }}</div>

    <div class="actions">
      <button class="btn btn-primary" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'Envoi…' : 'Créer la demande' }}
      </button>
    </div>
  </div>
</div>
