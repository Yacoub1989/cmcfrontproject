<div class="page">
  <header class="page-header">
    <div>
      <h1>Détails demande LABO</h1>
      <p class="subtitle">Traitement et résultats</p>
    </div>
    <a class="btn btn-outline" routerLink="/labo/queue">← Retour</a>
  </header>

  <div class="card" *ngIf="req() as r">
    <div class="kv">
      <div class="k">ID</div><div class="v mono">{{ r.id }}</div>
      <div class="k">Patient</div><div class="v mono">#{{ r.patientId }}</div>
      <div class="k">Demandé par</div><div class="v mono">{{ r.requestedBy }}</div>
      <div class="k">Statut</div><div class="v"><b>{{ r.status }}</b></div>
      <div class="k">Tests</div><div class="v">{{ r.tests }}</div>
    </div>

    <div class="sep"></div>

    <div class="grid">
      <div class="field span-2">
        <label>Résultat (texte)</label>
        <textarea class="input" rows="6" [(ngModel)]="resultText" [ngModelOptions]="{standalone:true}"></textarea>
      </div>

      <div class="field span-2">
        <label>Résultat structuré (JSON optionnel)</label>
        <textarea class="input" rows="5" [(ngModel)]="resultValuesJson" [ngModelOptions]="{standalone:true}"
                  placeholder='{"troponine":"0.12","crp":"5"}'></textarea>
      </div>
    </div>

    <div class="alert" *ngIf="err()">{{ err() }}</div>

    <div class="actions">
      <button class="btn btn-outline" (click)="start()" [disabled]="loading()">Démarrer</button>
      <button class="btn btn-primary" (click)="done()" [disabled]="loading()">Valider (DONE)</button>
    </div>
  </div>
</div>
